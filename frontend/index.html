<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LedgerDB Dashboard</title>
  <meta name="description" content="Personal finance dashboard powered by PostgreSQL business logic.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>LedgerDB Dashboard</h1>
      <p id="status">Checking health…</p>
      <button id="loadBtn">Load Analytics</button>
      <div class="charts-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;">
        <canvas id="monthlyChart"></canvas>
        <canvas id="categoryChart"></canvas>
        <canvas id="budgetChart"></canvas>
        <canvas id="trendChart"></canvas>
      </div>
      <pre id="output" style="display:none;"></pre>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
